<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Baji Bookshelf</title>
</head>
<body>
  <header>
    <h1>Baji Bookshelf</h1>
  </header>
  <main>
    <!-- ? Bagian Buat Inputnya Buku -->
    <section id="input-section">

      <h2>Input Your Book</h2>

      <form id="form-input-section" action="">

        <div>
        <label for="title">Title<span>*</span></label>
          <input id="title" type="text" name="title" value="" autofocus required>
        </div>

        <label for="sub-title">Sub Title <span>(Optional)</span></label>
          <input id="sub-title" type="text" name="sub-title" value="" required>

        <label for="author">Author</label>
          <input id="author" type="text" name="author" value="" required>

        <label for="publisher">Publisher</label>
          <input id="publisher" type="text" name="publisher" value="" required>

        <label for="isbn">Publisher</label>
          <input id="isbn" type="tel" name="isbn" value="" required>

        <label for="publication-year">Publication Year</label>
          <input id="publication-year" type="tel" name="publication-year" value="" required>

        <label for="place-of-publication">Place of Publication</label>
          <input id="place-of-publication" type="text" name="place-of-publication" value="" required>

        <label for="editor">Editor</label>
          <input id="editor" type="text" name="editor" value="" required>

        <label for="ilustrator">Ilustrator</label>
          <input id="ilustrator" type="text" name="ilustrator" value="" required>
        <button>Submit</button>
      </form>
    </section>

    <!-- ? Bagian Buat Nyari Buku -->
    <section id="search-section">
      <h2>Search Title</h2>
      <form id="form-search-section" action="">
        <label for="search-title">Title</label>
          <input type="text" name="search-title" id="search-title">
      </form>
    </section>

    <!-- ? Kumpulan Buku yang udah di baca -->
    <section id="bookshelf-read-section">
      <h2>Read</h2>
      <div id="read-list">
        
      </div>
    </section>

    <!-- ? Kumpulan Buku yang belum di baca -->
    <section id="bookshelf-unread-section">
      <h2>Unread</h2>
      <div id="unread-list"></div>
    </section>
    
  </main>
    
  <!-- ! Javascript File -->
  <script type="module" src="index.js" defer></script>

</body>
</html>
